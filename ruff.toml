# Shared ruff config for every Python service (ruff discovers it from parent dirs).
# The rule set is pinned explicitly so a new ruff release can't change what CI
# enforces; generated gRPC stubs are excluded.
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[lint]
select = ["E4", "E7", "E9", "F"]
